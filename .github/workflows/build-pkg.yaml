---
name: build dist

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - v*
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: |
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build-and-inspect-package:
    name: Build & inspect ${{ matrix.package.name }}.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        package:
          - {name: peewee_gis, path: ".", suffix: ""}
          # typing and docstrings only; installed with peewee_gis[typing]
          - {name: peewee_gis-stubs, path: stubs, suffix: "-stubs"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # hatch-vcs version from the tag

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          path: ${{ matrix.package.path }}
          upload-name-suffix: ${{ matrix.package.suffix }}

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    needs: build-and-inspect-package
    runs-on: ubuntu-latest

    permissions:
      checks: read     # wait for the check job
      id-token: write  # trusted publishing

    steps:
      - name: Download Python artifacts (peewee_gis and peewee_gis-stubs)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Packages*
          merge-multiple: true
          path: dist

      - name: Wait for tests to succeed
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be # v1.2.0
        id: wait-for-tests
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: check
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Stop unless the tests succeeded
        if: steps.wait-for-tests.outputs.conclusion != 'success'
        env:
          CONCLUSION: ${{ steps.wait-for-tests.outputs.conclusion }}
        run: |
          echo "::error::tests concluded '$CONCLUSION'; not publishing"
          exit 1

      - name: Push Python artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
