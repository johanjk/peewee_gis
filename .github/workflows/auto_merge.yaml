---
name: auto-merge

on:  # yamllint disable-line rule:truthy
  pull_request:  # yamllint disable-line rule:truthy

permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.repository == github.event.pull_request.head.repo.full_name
    permissions:
      checks: read          # wait for the check job
      contents: write       # gh pr merge --auto
      pull-requests: write  # gh pr merge --auto

    steps:
      - name: Wait for tests to succeed
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be # v1.2.0
        id: wait-for-tests
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: check
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Stop unless the tests succeeded
        if: steps.wait-for-tests.outputs.conclusion != 'success'
        env:
          CONCLUSION: ${{ steps.wait-for-tests.outputs.conclusion }}
        run: |
          echo "::error::tests concluded '$CONCLUSION'; not enabling auto-merge"
          exit 1

      - name: Enable auto-merge for Dependabot PRs
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
