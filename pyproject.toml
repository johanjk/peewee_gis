[project]
name = "peewee_gis"
dynamic = ["version"]
description = "PostGIS for the Peewee ORM: typed, documented, chainable ST_ functions and geometry fields."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = [
  "peewee",
  "postgis",
  "gis",
  "orm",
  "postgresql",
  "shapely",
  "vector tiles",
]
authors = [
  { name = "johanjk", email = "johan@datarokade.com" },
]
maintainers = [
  { name = "johanjk", email = "johan@datarokade.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",

  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",

  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "peewee>=4.2.4",
  "shapely>=2.0",
]

[project.optional-dependencies]
# typing and PostGIS manual docstrings for editors and type checkers; not needed at runtime
typing = [
  "peewee_gis-stubs",
]

[dependency-groups]
test = [
  "coverage[toml]>=6.5",
  "mktestdocs",
  "pytest>=9.0.0",
  "pytest-peewee",
  "pytest-xdist>=3.8.0",
  "mapbox-vector-tile>=2.1",
  "pyyaml>=6.0",
]
dev = [
  "psycopg[binary]>=3.2",
  "poethepoet>=0.45",
  "ruff",
  "deptry",
  "peewee_gis_generator",
  "peewee_gis-stubs",
]
types = [
  "mypy>=1.0.0",
  "pyright[nodejs]",
  "ty>=0.0.95",
  "types-pyyaml",
  "types-shapely",
]
dist = [
  "check-wheel-contents",
  "pkginfo",
  "pydistcheck",
  "pyroma",
  "twine",
  "uv",
  "wheel-inspect",
]

[project.urls]
Documentation = "https://github.com/johanjk/peewee_gis#readme"
Issues = "https://github.com/johanjk/peewee_gis/issues"
Source = "https://github.com/johanjk/peewee_gis"

[tool.uv]
package = true
default-groups = "all"
# The build hook renders `st/_generated/catalog.py` from the committed snapshot; rebuild the
# editable install when the snapshot or the generator changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "hatch_build.py" },
  { file = "generator/snapshots/*.json" },
  { file = "generator/src/**/*.py" },
  { file = "generator/src/**/*.jinja" },
  { git = { commit = true } },
]

[tool.uv.workspace]
members = ["generator", "stubs"]

[tool.uv.sources]
pytest-peewee = { git = "https://github.com/johanjk/pytest_peewee" }
peewee_gis_generator = { workspace = true }
peewee_gis-stubs = { workspace = true }

[build-system]
requires = [
  "hatchling",
  "hatch-vcs",
  "jinja2>=3.1",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/peewee_gis/version.py"

# Renders the function catalog into src/peewee_gis/st/_generated (see hatch_build.py);
# the typing is rendered by the peewee_gis-stubs package (stubs/).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
exclude = [
  "/.github",
  ".gitignore",
]
[tool.hatch.build.targets.wheel]
packages = ["src/peewee_gis"]
# gitignored, but must ship: it carries the typing and the function catalog
artifacts = ["src/peewee_gis/st/_generated/*.py"]
[tool.hatch.build.targets.sdist]
include = [
  "/src/peewee_gis",
  "/tests",
  "/docs",
  "/generator/src",
  "/generator/snapshots",
  "/generator/pyproject.toml",
  "/hatch_build.py",
  "/README.md",
  "/LICENSE",
  "/poe_tasks.toml",
  "/dev.sh",
  "/uv.lock",
]
exclude = ["/src/peewee_gis/st/_generated"]

[tool.coverage.run]
source_pkgs = ["peewee_gis"]
branch = true
parallel = true
omit = [
  "src/peewee_gis/version.py",
  "src/peewee_gis/st/_generated/*",
  "**/site-packages/**",
  "/tmp/**",
  "tests/*",
]

[tool.coverage.paths]
peewee_gis = ["src/peewee_gis"]

[tool.coverage.report]
omit = [
  "*/__init__.py",
  "**/_pytest/*",
]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "__version__",
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "\\.\\.\\.$",
]

[tool.pytest]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--color=yes",
  "--no-header",
]
testpaths = ["tests"]
filterwarnings = ["once::Warning"]

[tool.mypy]
files = ["src/peewee_gis"]
exclude = ["src/peewee_gis/version\\.py", "src/peewee_gis/st/_generated/"]
python_version = "3.14"
strict = true
warn_unused_ignores = true

# peewee's stubs leave many APIs untyped
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["playhouse", "playhouse.*"]
ignore_missing_imports = true

[tool.ty.src]
include = ["src/peewee_gis"]
exclude = ["src/peewee_gis/version.py", "src/peewee_gis/st/_generated"]

[tool.ty.rules]
all = "error"
# as in pytest-peewee: `if schema:` treats "" like None on purpose
truthiness-test-of-none-union = "ignore"
# peewee's stubs return untyped values from Context/Field APIs
unsound-return-statement = "ignore"

[tool.pyright]
include = ["src/peewee_gis"]
exclude = [
  "src/peewee_gis/version.py",
  "src/peewee_gis/st/_generated",
  "**/tests/**",
]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnusedImport = false
deprecateTypingAliases = true
reportImplicitOverride = true
reportMissingSuperCall = true
reportPropertyTypeMismatch = true
reportUnnecessaryTypeIgnoreComment = true
# peewee_gis.st._generated.api only exists as a stub (in peewee_gis-stubs), on purpose
reportMissingModuleSource = false
# peewee has incomplete type info
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.deptry]
known_first_party = ["peewee_gis"]
[tool.deptry.per_rule_ignores]
# the stubs extra is only read by type checkers, never imported
DEP002 = ["peewee_gis-stubs"]
